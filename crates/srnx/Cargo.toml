[package]
name = "srnx"
version = "0.1.0-rc.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Clean-room reader for the Succinct RINEX (SRNX) and RINEX observation file formats"
readme = "README.md"
keywords = ["gnss", "rinex", "srnx", "crinex", "geodesy"]
categories = ["science::geo", "parser-implementations", "encoding"]
publish = false
# The tests need tests/data, which includes third-party data under its own
# terms (see tests/data/README.md), so the published crate leaves them out.
exclude = ["tests/"]

[dependencies]
blake3.workspace = true
crc32c.workspace = true
thiserror.workspace = true

[lints]
workspace = true
