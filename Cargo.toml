[workspace]
resolver = "2"
members = [
    "crates/srnx",
    "crates/srnx-diff",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "Unlicense"
repository = "https://github.com/entrope/srnx-rs.git"

[workspace.dependencies]
srnx = { path = "crates/srnx", version = "0.1.0-rc.2" }
blake3 = "1"
crc32c = "0.6"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
